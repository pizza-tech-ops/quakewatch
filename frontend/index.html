<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>QuakeWatch</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #controls { padding: 8px; background: #f4f4f4; }
    #map { height: calc(100vh - 40px); }
  </style>
</head>
<body>
  <div id="controls">
    Min mag: <input id="minMag" type="number" value="2.5" step="0.1" />
    Days: <input id="days" type="number" value="30" />
    <button id="search">Search</button>
  </div>
  <div id="map"></div>

  <script>
    const map = L.map('map').setView([44.0, -120.5], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let markers = [];

    document.getElementById('search').onclick = async () => {
      const minMag = document.getElementById('minMag').value;
      const days = document.getElementById('days').value;

      // clear old markers
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const res = await fetch(`http://127.0.0.1:8000/quakes?min_mag=${minMag}&days=${days}`);
      const quakes = await res.json();

      quakes.forEach(q => {
        const m = L.marker([q.lat, q.lon])
          .bindPopup(`${q.mag} — ${q.place}<br>${q.time_utc}`)
          .addTo(map);
        markers.push(m);
      });
    };
  </script>
</body>
</html>
